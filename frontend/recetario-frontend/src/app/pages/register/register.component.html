<div class="auth-page">
  <p-card header="Crear cuenta" styleClass="auth-card">
    <form (ngSubmit)="onSubmit()" #f="ngForm" class="auth-form">
      <div class="field">
        <label for="fullName">Nombre completo</label>
        <input pInputText id="fullName" name="fullName" [(ngModel)]="fullName" required class="w-full" />
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input pInputText id="email" name="email" type="email" [(ngModel)]="email" required class="w-full" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <p-password id="password" name="password" [(ngModel)]="password" [toggleMask]="true"
          [feedback]="true" styleClass="w-full" inputStyleClass="w-full" required></p-password>
        <small>Mínimo 8 caracteres, con mayúscula, minúscula, número y símbolo.</small>
      </div>

      <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="w-full"></p-message>

      <button pButton type="submit" label="Registrarme" class="w-full" [loading]="loading" [disabled]="!f.valid"></button>

      <p class="switch-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </form>
  </p-card>
</div>
