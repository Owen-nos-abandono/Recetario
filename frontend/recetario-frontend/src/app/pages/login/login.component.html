<div class="auth-page">
  <p-card header="Iniciar sesión" styleClass="auth-card">
    <form (ngSubmit)="onSubmit()" #f="ngForm" class="auth-form">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input pInputText id="email" name="email" type="email" [(ngModel)]="email" required class="w-full" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <p-password id="password" name="password" [(ngModel)]="password" [toggleMask]="true"
          [feedback]="false" styleClass="w-full" inputStyleClass="w-full" required></p-password>
      </div>

      <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" styleClass="w-full"></p-message>

      <button pButton type="submit" label="Entrar" class="w-full" [loading]="loading" [disabled]="!f.valid"></button>

      <p class="switch-link">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
    </form>
  </p-card>
</div>
